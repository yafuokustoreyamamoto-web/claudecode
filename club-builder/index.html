<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CLUB BUILDER J</title>
<meta name="description" content="ホームタウンにクラブをつくり、J3からJ1の頂点を目指すサッカークラブ経営ゲーム。">
<meta name="theme-color" content="#0F4A33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px)}
:root{
  --bg:#E9EFE8; --surface:#FFFFFF; --surface2:#F3F7F2; --ink:#14241B; --muted:#5A6D61; --line:#D2DDD4;
  --pitch:#0F4A33; --pitch2:#16603F; --chalk:#F2F7F0; --amber:#D98E1F; --amber-ink:#8A5207; --amber-soft:#FBEBD2;
  --good:#1E8A4B; --bad:#C0392F; --warn:#B7790F; --good-soft:#DDF1E4; --bad-soft:#F8E0DD;
  --gk:#B7790F; --df:#2B6CB0; --mf:#1E8A4B; --fw:#C0392F;
  --board:#0B1F16; --board-ink:#F7E7C6;
  --radius:12px; --club:#C8102E;
  --f-display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B1510; --surface:#12211A; --surface2:#172A21; --ink:#E3EDE6; --muted:#93A89B; --line:#26392E;
    --pitch:#0E3F2B; --pitch2:#135238; --chalk:#E9F2EC; --amber:#F0A94A; --amber-ink:#F4C27C; --amber-soft:#3A2A12;
    --good:#4CC27E; --bad:#F07068; --warn:#E9B24F; --good-soft:#15352A; --bad-soft:#3B1C1A;
    --gk:#E9B24F; --df:#6FA8E8; --mf:#4CC27E; --fw:#F07068; --board:#06120C;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B1510; --surface:#12211A; --surface2:#172A21; --ink:#E3EDE6; --muted:#93A89B; --line:#26392E;
  --pitch:#0E3F2B; --pitch2:#135238; --chalk:#E9F2EC; --amber:#F0A94A; --amber-ink:#F4C27C; --amber-soft:#3A2A12;
  --good:#4CC27E; --bad:#F07068; --warn:#E9B24F; --good-soft:#15352A; --bad-soft:#3B1C1A;
  --gk:#E9B24F; --df:#6FA8E8; --mf:#4CC27E; --fw:#F07068; --board:#06120C;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--f-display);font-weight:400;letter-spacing:.01em}
.muted{color:var(--muted)}
small{font-size:12px}

/* ---- 設立画面 ---- */
#start{min-height:100%;background:var(--pitch);color:var(--chalk);padding:32px 16px 48px}
.start-in{max-width:520px;margin:0 auto;display:grid;gap:22px}
.brand{display:grid;gap:6px;padding-block:12px 4px;border-bottom:2px solid rgba(242,247,240,.25)}
.brand .eyebrow{font-size:12px;letter-spacing:.2em;opacity:.8}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,10vw,52px);line-height:1;margin:0;letter-spacing:.02em}
.brand h1 span{color:var(--amber)}
.brand p{margin:6px 0 10px;opacity:.9;text-wrap:balance}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:700;letter-spacing:.06em}
#start input,#start select{background:rgba(255,255,255,.95);color:#14241B;border:0}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.sw[aria-pressed="true"]{border-color:var(--amber)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--pitch);color:var(--chalk);border-color:var(--pitch)}
#start .seg button{background:transparent;border-color:rgba(242,247,240,.4);color:var(--chalk)}
#start .seg button[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#14241B}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:700;background:var(--pitch);color:var(--chalk);min-height:46px}
.btn.amber{background:var(--amber);color:#1C1406}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:var(--bad);color:#fff}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}
.start-note{font-size:13px;opacity:.85;display:grid;gap:4px}

/* ---- 本体 ---- */
#app{min-height:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--pitch);color:var(--chalk);border-bottom:4px solid var(--club)}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.crest{width:34px;height:34px;border-radius:9px;background:var(--club);display:grid;place-items:center;font-family:var(--f-display);font-size:13px;color:#fff;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.top-name{min-width:0;flex:1}
.top-name b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-name small{opacity:.8}
.top-money{text-align:right;font-weight:700}
.top-money small{display:block;font-weight:400;opacity:.75}
main{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:16px 24px;display:grid;gap:16px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{padding:8px 0 10px;display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--muted);font-weight:500}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--pitch2)}
:root[data-theme="dark"] nav.tabs button[aria-current="page"]{color:var(--good)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs button[aria-current="page"]{color:var(--good)}}
nav.tabs .badge{position:absolute;margin-left:18px;margin-top:-2px;background:var(--bad);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;line-height:16px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:grid;gap:10px}
.card h2,.sec-h{margin:0;font-size:13px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.sub{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.sub::-webkit-scrollbar{display:none}
.sub button{flex:none;padding:7px 14px;border-radius:999px;font-size:14px;border:1px solid var(--line);background:var(--surface)}
.sub button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* 次の試合（スコアボード） */
.fixture{background:var(--board);color:var(--board-ink);border-radius:16px;padding:16px;display:grid;gap:12px;position:relative;overflow:hidden}
.fixture:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 38px,rgba(255,255,255,.025) 38px 76px);pointer-events:none}
.fx-meta{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.12em;opacity:.85;position:relative}
.fx-vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;position:relative}
.fx-team{display:grid;gap:4px;justify-items:center;text-align:center}
.fx-team b{font-family:var(--f-display);font-weight:400;font-size:clamp(17px,5vw,22px);line-height:1.2;color:#fff;word-break:keep-all;overflow-wrap:anywhere}
.fx-team small{opacity:.75}
.fx-mid{font-family:var(--f-display);color:var(--amber);font-size:22px}
.fixture .btn{position:relative}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.stat small{color:var(--muted);letter-spacing:.06em}
.stat b{font-size:18px}
.stat .pill{justify-self:start}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.amber{background:var(--amber-soft);color:var(--amber-ink);border-color:transparent}

.check{display:grid;gap:0}
.check button{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line);text-align:left}
.check button:first-child{border-top:0}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line)}
.dot.on{background:var(--good);border-color:var(--good)}
.dot.need{border-color:var(--bad)}
.check .chev{color:var(--muted)}

.news{display:grid;gap:0;margin:0;padding:0;list-style:none}
.news li{padding:9px 0;border-top:1px solid var(--line);font-size:14px;display:grid;grid-template-columns:auto 1fr;gap:10px}
.news li:first-child{border-top:0}
.news .when{font-size:11px;color:var(--muted);padding-top:2px;min-width:44px}
.news li.big b{color:var(--pitch2)}
.news li.warn{color:var(--bad)}

/* 選手行 */
.plist{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.prow{display:grid;grid-template-columns:36px 1fr auto 44px;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);text-align:left;width:100%}
.prow:first-child{border-top:0}
.prow:active{background:var(--surface2)}
.pos{font-size:11px;font-weight:700;text-align:center;border-radius:6px;padding:3px 0;color:#fff}
.pos-gk{background:var(--gk)} .pos-df{background:var(--df)} .pos-mf{background:var(--mf)} .pos-fw{background:var(--fw)}
:root[data-theme="dark"] .pos{color:#0B1510}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pos{color:#0B1510}}
.pn{min-width:0;display:grid}
.pn b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ovr{font-family:var(--f-display);font-size:20px;text-align:right}
.side{display:grid;justify-items:end;gap:3px;font-size:12px;color:var(--muted)}
.bar{width:44px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.bar i.mid{background:var(--warn)} .bar i.low{background:var(--bad)}
.grade{font-weight:700;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--amber-ink)}
.tag{font-size:10px;font-weight:700;border-radius:4px;padding:0 4px;background:var(--bad);color:#fff;margin-left:4px;vertical-align:1px}
.tag.leg{background:var(--amber);color:#1C1406}
.tag.list{background:var(--df)}
.more{padding:12px;text-align:center;color:var(--muted);border-top:1px solid var(--line);width:100%}

/* 布陣 */
.pitch{position:relative;width:100%;max-width:440px;margin:0 auto;aspect-ratio:68/88;border-radius:14px;background:
  repeating-linear-gradient(180deg,var(--pitch) 0 11.1%,var(--pitch2) 11.1% 22.2%);overflow:hidden}
.pitch:before{content:"";position:absolute;inset:4%;border:2px solid rgba(255,255,255,.4);border-radius:4px}
.pitch:after{content:"";position:absolute;left:4%;right:4%;top:50%;border-top:2px solid rgba(255,255,255,.4)}
.pitch .circle{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;border:2px solid rgba(255,255,255,.4);border-radius:50%;transform:translate(-50%,-50%)}
.pitch .box{position:absolute;left:28%;right:28%;height:13%;border:2px solid rgba(255,255,255,.4)}
.pitch .box.t{top:4%;border-top:0} .pitch .box.b{bottom:4%;border-bottom:0}
.slot{position:absolute;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:2px;width:25%;z-index:2}
.slot .chip{background:rgba(6,18,12,.82);color:#fff;border-radius:8px;padding:3px 6px;display:grid;justify-items:center;width:100%;border:1px solid rgba(255,255,255,.2)}
.slot .chip b{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slot .chip span{font-family:var(--f-display);font-size:14px;line-height:1.1}
.slot .sp{font-size:10px;font-weight:700;color:#fff;background:rgba(0,0,0,.35);border-radius:4px;padding:0 4px}
.slot.poor .chip{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.slot.empty .chip{border-style:dashed}
.opts{display:grid;gap:12px}
.opt-row{display:grid;gap:6px}
.opt-row > small{color:var(--muted);font-weight:700;letter-spacing:.06em}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.sw-t{width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none}
.sw-t:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.sw-t[aria-checked="true"]{background:var(--good)}
.sw-t[aria-checked="true"]:after{left:23px}

/* 表 */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 5px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;border-bottom:1px solid var(--line)}
td{border-top:1px solid var(--line)}
th:nth-child(2),td:nth-child(2){text-align:left;width:100%}
tr.mine td{background:var(--amber-soft);font-weight:700}
td.zone{padding:0;width:4px}
td.zone.up{background:var(--good)} td.zone.down{background:var(--bad)}
.form{letter-spacing:1px;font-size:12px}
.form .W{color:var(--good)} .form .L{color:var(--bad)} .form .D{color:var(--muted)}

.fac{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.fac:first-of-type{border-top:0}
.fac-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pips{display:flex;gap:3px}
.pips i{width:14px;height:6px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--amber)}
.fac p{margin:0;font-size:13px;color:var(--muted)}
.fac-a{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.rows{display:grid}
.rows > div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.rows > div:first-child{border-top:0}
.rows > div.total{font-weight:700}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:18px;font-weight:700}
.stepper b{min-width:92px;text-align:center}
.banner{padding:10px 14px;border-radius:10px;font-size:14px;background:var(--surface2);border:1px solid var(--line)}
.banner.open{background:var(--good-soft);border-color:transparent;color:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.chips button[aria-pressed="true"]{background:var(--pitch);color:var(--chalk);border-color:var(--pitch)}
.region{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.region:first-child{border-top:0}
.region[disabled]{opacity:.45}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:14px}

/* シート */
.scrim{position:fixed;inset:0;background:rgba(6,14,10,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-h h3{margin:0;font-size:20px;line-height:1.3}
.x{width:36px;height:36px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);font-size:18px;flex:none}
.phead{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.big-ovr{font-family:var(--f-display);font-size:44px;line-height:1;background:var(--board);color:var(--board-ink);border-radius:12px;padding:10px 12px;min-width:84px;text-align:center}
.big-ovr small{display:block;font-family:var(--f-body);font-size:10px;letter-spacing:.14em;opacity:.8;margin-top:4px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kv div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid}
.kv small{color:var(--muted)}
.odds{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.msg{padding:10px 12px;border-radius:10px;font-size:14px}
.msg.ok{background:var(--good-soft);color:var(--good)} .msg.ng{background:var(--bad-soft);color:var(--bad)}
.confirm{display:grid;gap:10px;padding:12px;border-radius:10px;background:var(--bad-soft)}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* 試合 */
#match{position:fixed;inset:0;z-index:60;background:var(--board);color:var(--board-ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.mb{max-width:640px;width:100%;margin:0 auto;padding:16px;display:grid;gap:10px;border-bottom:1px solid rgba(247,231,198,.15)}
.mb-label{font-size:12px;letter-spacing:.16em;opacity:.75;text-align:center}
.mb-score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.mb-team{display:grid;justify-items:center;gap:6px;text-align:center}
.mb-team b{color:#fff;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.mb-team i{display:block;width:30px;height:6px;border-radius:3px}
.mb-digits{font-family:var(--f-display);font-size:48px;line-height:1;color:var(--amber);display:flex;gap:10px;align-items:center}
.mb-digits span.sep{font-size:28px;opacity:.6}
.mb-clock{justify-self:center;font-family:var(--f-display);font-size:14px;background:rgba(247,231,198,.1);padding:2px 12px;border-radius:999px}
.feed{flex:1;overflow-y:auto;max-width:640px;width:100%;margin:0 auto;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.ev{display:grid;grid-template-columns:40px 1fr;gap:8px;font-size:14px;padding:6px 10px;border-radius:8px;background:rgba(247,231,198,.05)}
.ev .m{font-family:var(--f-display);opacity:.7;font-size:13px}
.ev.a{background:rgba(247,231,198,.02)}
.ev.a .t{text-align:right}
.ev.goal{background:rgba(217,142,31,.25);color:#fff;font-weight:700}
.ev.red .t{color:#FF8C84}
.ev.half{background:transparent;text-align:center;grid-template-columns:1fr;opacity:.7;font-size:12px;letter-spacing:.1em}
.ev.half .m{display:none}
.ev.new{animation:pop .3s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.mctl{max-width:640px;width:100%;margin:0 auto;padding:12px 16px;display:flex;gap:8px}
.mctl .btn{flex:1}
.mctl .btn.ghost{color:var(--board-ink);border-color:rgba(247,231,198,.3)}

  const r = autoXI(c, c.form);

function power(ts, onField) {

  for (const x of onField) {
    const e = x.p ? effOf(x.p, x.slot) + ts.coach * .6 : 30;

/* ---------- 試合 ---------- */
const CHANCE_TXT = [
  n => `${n}のシュートはGKが好セーブ`, n => `${n}、ミドルシュートは枠の上`, n => `${n}のヘディングはポストに当たる`,
  n => `${n}が裏へ抜け出すもオフサイド`, n => `${n}のフリーキックは壁に当たる`, n => `${n}のシュートはわずかに左へ外れる`,
  n => `${n}の決定機、DFが体を投げ出してブロック`, n => `${n}のクロスに合わせきれない`,
];
function simMatch(hid, aid, opt = {}) {
  const T = [teamSetup(hid), teamSetup(aid)];
  const field = T.map(t => t.xi.map(x => ({ ...x })));
  const played = T.map(t => new Set(t.xi.filter(x => x.p).map(x => x.p.id)));
  const reds = [0, 0], goals = [0, 0], ev = [], sc = [], home = opt.neutral ? 0 : .1;
  const medF = cid => cid === G.me.cid ? 1 - G.me.fac.medical * .12 : 1;
  const nm = p => p ? p.n : '選手';
  const lam = () => {
    const P = field.map((f, i) => power(T[i], f));
    return [0, 1].map(i => {
      const o = 1 - i;
      let l = 1.25 * Math.exp((P[i].att - P[o].def) / 15 + (P[i].mid - P[o].mid) / 36 + (i === 0 ? home : -home));
      l *= Math.pow(.72, reds[i]) * Math.pow(1.15, reds[o]);
      return clamp(l, .12, 5.5);
    });
  };
  const scorer = i => {
    const cand = field[i].filter(x => x.p && x.slot !== 'GK');
    return cand.length ? wpick(cand, x => Math.pow(ATTW[x.slot] + .05, 1.4) * x.p.ovr).p : null;
  };
  const push = (m, side, t, text) => ev.push({ m, side, t, text });
  let L = lam();
  const play = (from, to) => {
    for (let m = from; m <= to; m++) {
      if (m === 65 || m === 78) doSubs(m);
      for (const i of [0, 1]) {
        if (rnd() < L[i] / 90) {
          goals[i]++;
          const s = scorer(i), aCand = field[i].filter(x => x.p && x.p !== s && x.slot !== 'GK');
          const a = aCand.length && rnd() < .72 ? wpick(aCand, x => ATTW[x.slot] + .3).p : null;
          sc.push({ m, side: i, s: s && s.id, a: a && a.id });
          push(m, i, 'goal', `ゴール！ ${nm(s)}` + (a ? `（アシスト ${a.n}）` : ''));
        } else if (opt.detail && rnd() < L[i] * 1.6 / 90) {
          push(m, i, 'chance', pick(CHANCE_TXT)(nm(scorer(i))));
        }
        if (rnd() < .0014) { // 一発退場
          const cand = field[i].filter(x => x.p && x.slot !== 'GK');
          if (cand.length) { const x = pick(cand); x.p.sus = 1; x.red = true; push(m, i, 'red', `${x.p.n}が一発退場`); field[i] = field[i].filter(y => y !== x); reds[i]++; L = lam(); }
        } else if (opt.detail && rnd() < .018) {
          const cand = field[i].filter(x => x.p); if (cand.length) push(m, i, 'yellow', `${pick(cand).p.n}にイエローカード`);
        }
      }
      if (m === 45 && opt.detail) push(45, -1, 'half', '前半終了');
    }
  };
  const doSubs = m => {
    for (const i of [0, 1]) {
      const bench = T[i].bench.filter(p => !played[i].has(p.id));
      const tired = field[i].filter(x => x.p && x.slot !== 'GK').sort((a, b) => a.p.cond - b.p.cond);
      const n = m === 65 ? 2 : 1;
      for (let k = 0; k < n && tired.length; k++) {
        const out = tired.shift();
        if (out.p.cond > 82 && m === 65) continue;
        let best = null, be = effOf(out.p, out.slot) * .98;
        for (const p of bench) { if (played[i].has(p.id)) continue; const e = effOf(p, out.slot); if (e > be) { be = e; best = p; } }
        if (!best) continue;
        played[i].add(best.id);
        if (opt.detail) push(m, i, 'sub', `交代 ${out.p.n} → ${best.n}`);
        out.p = best;
      }
    }
    L = lam();
  };
  play(1, 90);
  let et = false, pk = null;
  if (opt.cup && goals[0] === goals[1]) {
    et = true; if (opt.detail) push(90, -1, 'half', '延長戦へ');
    const L0 = L; L = L0.map(x => x / 3 * 1.0); play(91, 120); L = L0;
    if (goals[0] === goals[1]) {
      const gk = f => { const x = field[f].find(y => y.slot === 'GK'); return x && x.p ? x.p.ovr : 50; };
      const pH = clamp(.5 + (gk(0) - gk(1)) / 80, .3, .7);
      let a = 0, b = 0;
      for (let k = 0; k < 5; k++) { if (rnd() < .76 + (pH - .5) * .2) a++; if (rnd() < .76 - (pH - .5) * .2) b++; }
      while (a === b) { if (rnd() < .76) a++; if (rnd() < .76) b++; }
      pk = [a, b];
      if (opt.detail) push(120, -1, 'pk', `PK戦 ${a}-${b}`);
    }
  }
  // 試合後処理：出場・疲労・けが
  const inj = [];
  for (const i of [0, 1]) {
    const cid = i ? aid : hid, pressExtra = T[i].press ? 4 : 0;
    for (const id of played[i]) {
      const p = G.P[id];
      p.cond = clamp(p.cond - ri(9, 15) - pressExtra, 30, 100);
      if (!opt.cup) p.st.ap++;
      p.tot.ap++;
      if (rnd() < .018 * medF(cid)) { p.inj = Math.max(1, Math.round(ri(1, 6) * (cid === G.me.cid ? 1 - G.me.fac.medical * .1 : 1))); inj.push(p.id); if (opt.detail) push(90, i, 'inj', `${p.n}が負傷（全治${p.inj}週）`); }
    }
    // 出場停止の消化（今回の退場者以外）
    for (const p of players(G.C[cid])) if (p.sus && !field[i].some(x => x.red && x.p === p) && !played[i].has(p.id)) p.sus = 0;
  }
  for (const g of sc) {
    if (!opt.cup) { if (g.s != null) G.P[g.s].st.g++; if (g.a != null) G.P[g.a].st.a++; }
    if (g.s != null) G.P[g.s].tot.g++;
  }
  ev.sort((a, b) => a.m - b.m);
  let win = goals[0] > goals[1] ? 0 : goals[0] < goals[1] ? 1 : -1;
  if (pk) win = pk[0] > pk[1] ? 0 : 1;
  return {
    h: hid, a: aid, gh: goals[0], ga: goals[1], et, pk, win, ev, sc, cup: !!opt.cup,
    xi: opt.detail ? T.map((t, i) => t.xi.map(x => ({ id: x.p && x.p.id, slot: x.slot }))) : null,
    used: opt.detail ? played.map(s => [...s]) : null,
  };
}

/* ---------- 日程・順位 ---------- */
function roundRobin(ids) {
  const t = shuffle(ids.slice()); if (t.length % 2) t.push(-1);
  const n = t.length, rounds = [];
  for (let r = 0; r < n - 1; r++) {
    const pairs = [];
    for (let i = 0; i < n / 2; i++) {
      const a = t[i], b = t[n - 1 - i];
      if (a >= 0 && b >= 0) pairs.push((r + i) % 2 ? [a, b] : [b, a]);
    }
    rounds.push(pairs);
    t.splice(1, 0, t.pop());
  }
  return rounds.concat(rounds.map(r => r.map(([a, b]) => [b, a])));
}
function divClubs(d) { return G.C.filter(c => c.div === d).map(c => c.id); }
function table(d) {
  return divClubs(d).map(id => ({ id, ...G.tb[id] })).sort((x, y) => (y.p - x.p) || ((y.gf - y.ga) - (x.gf - x.ga)) || (y.gf - x.gf) || (clubStrength(G.C[y.id]) - clubStrength(G.C[x.id])));
}
const rankOf = cid => table(G.C[cid].div).findIndex(r => r.id === cid) + 1;
function record(r) {
  const H = G.tb[r.h], A = G.tb[r.a];
  H.gf += r.gh; H.ga += r.ga; A.gf += r.ga; A.ga += r.gh;
  if (r.gh > r.ga) { H.w++; H.p += 3; A.l++; } else if (r.gh < r.ga) { A.w++; A.p += 3; H.l++; } else { H.d++; A.d++; H.p++; A.p++; }
  for (const [cid, res] of [[r.h, r.gh > r.ga ? 'W' : r.gh < r.ga ? 'L' : 'D'], [r.a, r.ga > r.gh ? 'W' : r.ga < r.gh ? 'L' : 'D']]) {
    const t = G.tb[cid]; t.f = (t.f + res).slice(-5);
  }
}

  const r1 = shuffle(all.filter(id => !seeds.includes(id)));

  const divF = { J1: 3, J2: 1.8, J3: 1 }[myDiv()];
  const big = opp && opp.div === 'J1' ? 1.15 : 1;
  const base = (m.fans * .6 * (.85 + .4 * wr) + m.pop * 1.2 * divF) * priceF * big;
  return Math.round(clamp(base * (.9 + rnd() * .2), 200, FAC.stadium.cap[m.fac.stadium]));
}
function playCupRound() {
  const cup = G.cup, next = [], nm = CUP_ROUNDS[cup.r];
  let show = null;
  for (const [h, a] of cup.ties) {
    const r = simMatch(h, a, { cup: true, neutral: cup.r === 5, detail: h === G.me.cid || a === G.me.cid });
    const w = r.win === 0 ? h : a, l = w === h ? a : h;
    cup.out[l] = nm; next.push(w);
    cup.res.push({ r: cup.r, h, a, gh: r.gh, ga: r.ga, pk: r.pk });
    if (r.xi) { r.label = `天皇杯 ${nm}`; show = r; afterMyMatch(r); }
  }
  cup.r++;
  const alive = next.concat(cup.r === 1 ? cup.byes : []);
  if (alive.length === 1) {
    cup.champ = alive[0];
    addNews(`天皇杯は${G.C[alive[0]].name}が優勝`, alive[0] === G.me.cid ? 'big' : '');
    if (alive[0] === G.me.cid) { earn('prize', 15000); G.titles.push({ y: G.year, t: '天皇杯' }); }
    const fin = cup.res[cup.res.length - 1]; const ru = fin.h === alive[0] ? fin.a : fin.h;
    if (ru === G.me.cid) earn('prize', 5000);
    cup.ties = [];
  } else {
    shuffle(alive); cup.ties = [];
    for (let i = 0; i < alive.length; i += 2) cup.ties.push(cupHome(alive[i], alive[i + 1]));
    if (!alive.includes(G.me.cid) && cup.out[G.me.cid] === nm) addNews(`天皇杯は${nm}で敗退`);
  }
  return show;
}

/* 毎週の処理：お金・成長・回復・工事・スカウト・オファー */
function weekly() {
  const m = G.me, c = me();
  const sal = players(c).reduce((s, p) => s + p.sal, 0);
  spend('salary', Math.round(sal / SEASON_WEEKS));
  spend('staff', Math.round((m.staff.coach.sal + m.staff.trainer.sal + m.staff.scout.sal) / SEASON_WEEKS));
  const maint = m.fac.stadium * 1500 + (m.fac.training + m.fac.clubhouse + m.fac.medical + m.fac.youth + m.fac.shop) * 500;
  spend('maint', Math.round(maint / SEASON_WEEKS));
  earn('merch', Math.round(m.fans * (.004 + m.fac.shop * .004)));
  if (m.sponsor) earn('sponsor', Math.round(m.sponsor.amt / SEASON_WEEKS));
  // 成長・回復
  const lastPlayed = new Set();
  const trMult = (.85 + m.staff.trainer.lv * .08) * (1 + m.fac.training * .1);
  const pol = { normal: [1, 1, 0], youth: [1.3, .8, -2], rest: [.7, .7, 6] }[m.policy];
  for (const p of G.P) {
    if (!p || p.c === -2) continue;
    let mult = 1, rec = 9;
    if (p.c === m.cid) { mult = trMult * (p.age <= 23 ? pol[0] : pol[1]); rec += m.fac.clubhouse * 2 + pol[2]; }
    else if (p.c >= 0) mult = { J1: 1.1, J2: 1, J3: .9 }[G.C[p.c].div];
    else mult = .6;
    grow(p, mult);
    p.cond = clamp(p.cond + rec, 30, 100);
    if (p.inj) p.inj--;
  }
  // 工事
  for (const b of m.build) b.w--;
  for (const b of m.build.filter(b => b.w <= 0)) { m.fac[b.k] = b.lv; addNews(`${FAC[b.k].n}がレベル${b.lv}に完成した`, 'big'); }
  m.build = m.build.filter(b => b.w > 0);
  // スカウト
  if (G.scout) { G.scout.left--; if (G.scout.left <= 0) scoutReturn(); }
  // オファー
  G.offers = G.offers.filter(o => o.exp >= G.wk);
  if (windowOpen() || G.phase === 'pre') makeOffers();
  if (m.money < 0) addNews(`資金がマイナスです（${fmtMoney(m.money)}）。シーズン終了時に−3億円を下回ると解任されます`, 'warn');
}
function grow(p, mult) {
  const a = p.age;
  if (a <= 29 && p.ovr < p.pot) {
    const rate = a <= 21 ? .011 : a <= 24 ? .008 : a <= 27 ? .004 : .0015;
    p.ovr = Math.min(p.pot, p.ovr + (p.pot - p.ovr) * rate * mult + (rnd() < .02 * mult ? .3 : 0));
  } else if (a >= 31) {
    p.ovr = Math.max(35, p.ovr - .014 * (a - 30) * (.7 + rnd() * .6));
  }
}
function makeOffers() {
  const mine = players(me());
  for (const p of mine) {
    const pr = p.listed ? .3 : (p.ovr >= clubStrength(me()) + 4 ? .03 : .006);
    if (rnd() > pr || G.offers.some(o => o.pid === p.id)) continue;
    const buyers = G.C.filter(c => !c.me && DIVS.indexOf(c.div) <= DIVS.indexOf(myDiv()) && clubStrength(c) - 6 < p.ovr);
    if (!buyers.length) continue;
    const b = pick(buyers), v = valueOf(p);
    const fee = Math.round(v * (p.listed ? .75 + rnd() * .35 : 1 + rnd() * .5) / 10) * 10;
    G.offers.push({ pid: p.id, from: b.id, fee, exp: G.wk + 3 });
    addNews(`${b.name}から${p.n}に${fmtMoney(fee)}のオファーが届いた`, 'offer');
  }
}
function acceptOffer(i) {
  const o = G.offers[i], p = G.P[o.pid];
  if (!p || p.c !== G.me.cid) { G.offers.splice(i, 1); return '選手はもういません'; }
  if (me().pids.length <= SQUAD_MIN && G.phase === 'season') return `シーズン中は${SQUAD_MIN}人を下回れません`;
  earn('sale', o.fee); setClub(p, o.from); p.yrs = ri(2, 4);
  G.offers = G.offers.filter(x => x.pid !== p.id);
  addNews(`${p.n}を${G.C[o.from].name}へ${fmtMoney(o.fee)}で売却した`);
  return null;
}

/* ---------- スカウト ---------- */
function scoutRegions() {
  const lv = G.me.staff.scout.lv;
  const leagues = [...new Set(G.P.filter(p => p && p.src === 'EU').map(p => p.lgn))];
  const r = [
    { k: 'J1', n: 'J1のクラブ', wk: 2 }, { k: 'J2', n: 'J2のクラブ', wk: 2 }, { k: 'J3', n: 'J3のクラブ', wk: 2 },
    { k: 'FA', n: 'フリーの選手', wk: 1 }, { k: 'AB', n: '欧州でプレーする日本人', wk: 3 },
    ...leagues.map(l => ({ k: 'EU:' + l, n: l, wk: 4 })),
    { k: 'LEG', n: '欧州のレジェンド', wk: 5, need: 3 },
  ];
  return r.map(x => ({ ...x, wk: Math.max(1, x.wk - Math.floor((lv - 1) / 2)), cost: x.wk * 100 * (x.k.startsWith('EU') || x.k === 'LEG' ? 3 : 1), lock: x.need && lv < x.need }));
}
function sendScout(k) {
  const reg = scoutRegions().find(r => r.k === k);
  if (!reg || reg.lock || G.scout) return;
  spend('other', reg.cost);
  G.scout = { k, n: reg.n, left: reg.wk };
  if (G.phase === 'pre') { G.scout.left = 0; scoutReturn(); }
}
function scoutReturn() {
  const s = G.scout, lv = G.me.staff.scout.lv;
  let pool;
  if (s.k === 'FA') pool = G.P.filter(p => p && p.c === -1);
  else if (s.k === 'AB') pool = G.P.filter(p => p && p.src === 'AB');
  else if (s.k === 'LEG') pool = G.P.filter(p => p && p.src === 'EL' && p.c === -2);
  else if (s.k.startsWith('EU:')) pool = G.P.filter(p => p && p.c === -2 && p.lgn === s.k.slice(3));
  else pool = G.P.filter(p => p && p.c >= 0 && !G.C[p.c].me && G.C[p.c].div === s.k);
  pool = pool.filter(p => !G.watch.includes(p.id));
  const n = 3 + lv;
  const found = pool.map(p => ({ p, sc: p.pot * (.6 + lv * .08) + p.ovr * .3 - Math.max(0, p.age - 27) * 1.5 + rnd() * 22 }))
    .sort((a, b) => b.sc - a.sc).slice(0, n).map(x => x.p.id);
  G.watch = found.concat(G.watch).slice(0, 60);
  addNews(`スカウトが${s.n}から戻り、${found.length}人の選手をリストに加えた`, 'scout');
  G.scout = null;
}

/* ---------- 移籍交渉 ---------- */
function rep() {
  let r = { J1: 68, J2: 56, J3: 46 }[myDiv()];
  r += Math.min(10, G.me.fans / 8000) + Math.min(8, G.titles.length * 2);
  return r;
}
function negoOdds(p, fee, sal) {
  const expect = salaryFor(p.ovr, isForeign(p));
  const s = sal / expect;
  let lp = (rep() + 12 - p.ovr) / 4 + (s - 1) * 4;
  if (p.c === -1) lp += 1;
  if (p.c === -2) lp -= 1.5;
  if (p.c >= 0 && DIVS.indexOf(G.C[p.c].div) > DIVS.indexOf(myDiv())) lp += 1.5;
  if (p.legend && p.src === 'JL') lp += .5;
  let ls = 10;
  if (p.c !== -1) {
    const v = valueOf(p);
    ls = (fee / v - 1) * 7;
    if (p.c >= 0) { const top = players(G.C[p.c]).sort((a, b) => b.ovr - a.ovr).slice(0, 3); if (top.includes(p)) ls -= 1; }
  }
  return { player: sig(lp), club: sig(ls), expect };
}
function negotiate(pid, fee, sal, yrs) {
  const p = G.P[pid], m = G.me;
  if (!p) return { ok: false, msg: '選手が見つかりません' };
  const needWindow = p.c !== -1;
  if (needWindow && !windowOpen()) return { ok: false, msg: '移籍市場が閉まっています（プレシーズンと第17〜20節のあとに開きます）' };
  if (G.tried[pid] === G.wk) return { ok: false, msg: 'この選手とは今週すでに交渉しました。次の週にもう一度どうぞ' };
  if (me().pids.length >= SQUAD_MAX) return { ok: false, msg: `選手は${SQUAD_MAX}人までです` };
  if (p.c === -1) fee = 0;
  if (m.money < fee) return { ok: false, msg: '資金が足りません' };
  G.tried[pid] = G.wk;
  const od = negoOdds(p, fee, sal);
  const from = p.c >= 0 ? G.C[p.c].name : p.c === -2 ? p.ab : 'フリー';
  if (rnd() > od.club) {
    const hint = Math.round(valueOf(p) * (1.05 + rnd() * .25) / 10) * 10;
    log(`${p.n}：${from}が移籍金${fmtMoney(fee)}を拒否`);
    return { ok: false, msg: `${from}が拒否しました。${fmtMoney(hint)}前後なら応じるかもしれません` };
  }
  if (rnd() > od.player) {
    log(`${p.n}：本人が年俸${fmtMoney(sal)}を拒否`);
    return { ok: false, msg: `${p.n}本人が断りました。年俸を上げるか、クラブの評価を上げてから再挑戦しましょう` };
  }
  spend('buy', fee);
  setClub(p, m.cid);
  p.sal = sal; p.yrs = yrs; p.cond = Math.max(p.cond || 80, 80); p.inj = 0; p.sus = 0; p.st = { g: 0, a: 0, ap: 0 };
  if (!p.tot) p.tot = { g: 0, ap: 0 };
  G.watch = G.watch.filter(x => x !== pid);
  addNews(`${p.n}（${from}）の獲得が決まった` + (fee ? `。移籍金${fmtMoney(fee)}` : ''), 'big');
  return { ok: true, msg: `${p.n}が加入しました` };
}
function release(pid) {
  const p = G.P[pid];
  if (!p || p.c !== G.me.cid) return 'この選手はいません';
  if (me().pids.length <= SQUAD_MIN && G.phase === 'season') return `シーズン中は${SQUAD_MIN}人を下回れません`;
  const pay = Math.round(p.sal * .5 / 10) * 10;
  spend('other', pay); setClub(p, -1);
  addNews(`${p.n}との契約を解除した（違約金${fmtMoney(pay)}）`);
  return null;
}
function signYouth(i) {
  const y = G.me.youth[i];
  if (!y) return;
  if (me().pids.length >= SQUAD_MAX) return `選手は${SQUAD_MAX}人までです`;
  const p = mkP(y); setClub(p, G.me.cid);
  G.me.youth.splice(i, 1);
  addNews(`ユースの${p.n}がトップチームに昇格した`);
  return null;
}
function renewContract(pid, yrs) {
  const r = G.me.renew.find(x => x.id === pid), p = G.P[pid];
  if (!r || !p) return;
  p.sal = r.sal; p.yrs = yrs;
  G.me.renew = G.me.renew.filter(x => x.id !== pid);
  addNews(`${p.n}と${yrs}年契約を結んだ（年俸${fmtMoney(r.sal)}）`);
}
function hireStaff(i) {
  const s = G.me.staffCands[i];
  if (!s) return '候補がいません';
  const fee = Math.round(s.sal * .5 / 10) * 10;
  if (G.me.money < fee) return '資金が足りません';
  spend('other', fee);
  G.me.staff[s.role] = { n: s.n, lv: s.lv, sal: s.sal };
  G.me.staffCands = G.me.staffCands.filter(x => x.role !== s.role);
  addNews(`${STAFF[s.role].n}に${s.n}（Lv${s.lv}）を迎えた`);
  return null;
}
function buildFacility(k) {
  const m = G.me, f = FAC[k], lv = m.fac[k] + 1;
  if (lv > f.max) return 'これ以上は拡張できません';
  if (m.build.some(b => b.k === k)) return '工事中です';
  if (m.money < f.cost[lv]) return '資金が足りません';
  spend('build', f.cost[lv]);
  m.build.push({ k, lv, w: f.wk[lv] });
  addNews(`${f.n}のレベル${lv}への工事を始めた（${f.wk[lv]}週）`);
  return null;
}

/* ---------- シーズン終了 ---------- */
function endSeason() {
  const m = G.me, summary = { year: G.year, lines: [] };
  const T = {}; for (const d of DIVS) T[d] = table(d).map(r => r.id);
  const myD = myDiv(), myRank = T[myD].indexOf(m.cid) + 1;
  summary.div = myD; summary.rank = myRank;
  // 賞金
  const pz = PRIZE[myD][myRank - 1]; if (pz) earn('prize', pz);
  if (m.sponsor && m.sponsor.rank && myRank <= 3) earn('sponsor', m.sponsor.rank);
  for (const d of DIVS) {
    const champ = G.C[T[d][0]];
    addNews(`${G.year}年の${d}は${champ.name}が優勝`, champ.me ? 'big' : '');
    const sc = G.P.filter(p => p && p.c >= 0 && G.C[p.c].div === d).sort((a, b) => b.st.g - a.st.g)[0];
    if (sc) summary.lines.push(`${d}得点王：${sc.n}（${G.C[sc.c].name}）${sc.st.g}点`);
  }
  if (myRank === 1) G.titles.push({ y: G.year, t: `${myD}優勝` });
  G.hist.push({ y: G.year, div: myD, rank: myRank, cup: G.cup.champ === m.cid ? '優勝' : (G.cup.out[m.cid] || '—'), fans: m.fans, money: m.money,
    w: G.tb[m.cid].w, d: G.tb[m.cid].d, l: G.tb[m.cid].l });
  // 昇格・降格（ライセンス：J2は1万人、J1は1万5千人）
  const lic = (cid, d) => cid !== m.cid || FAC.stadium.cap[m.fac.stadium] >= (d === 'J1' ? 15000 : 10000);
  const up = (d, to) => { const out = []; for (const id of T[d]) { if (out.length === 3) break; if (lic(id, to)) out.push(id); else if (T[d].indexOf(id) < 3) summary.lines.push(`スタジアムの収容人数が足りず、${to}ライセンスが下りなかった`); } return out; };
  const up2 = up('J2', 'J1'), up3 = up('J3', 'J2');
  const down1 = T.J1.slice(-3), down2 = T.J2.filter(id => !up2.includes(id)).slice(-3);
  up2.forEach(id => G.C[id].div = 'J1'); down1.forEach(id => G.C[id].div = 'J2');
  up3.forEach(id => G.C[id].div = 'J2'); down2.forEach(id => G.C[id].div = 'J3');
  const newD = myDiv();
  if (newD !== myD) {
    const upM = DIVS.indexOf(newD) < DIVS.indexOf(myD);
    summary.lines.unshift(upM ? `${newD}昇格が決まった！` : `${newD}へ降格…`);
    addNews(upM ? `${me().name}、${newD}昇格！` : `${me().name}は${newD}へ降格`, 'big');
    m.fans = Math.round(m.fans * (upM ? 1.2 : .9));
  }
  G.lastTop = T.J1.slice(0, 4).filter(id => G.C[id].div === 'J1');
  summary.fin = JSON.parse(JSON.stringify(G.fin));
  summary.newDiv = newD;
  // 加齢・引退・契約
  G.year++;
  for (const p of G.P) {
    if (!p) continue;
    p.age++;
    if (p.c === -2) {
      if (p.age <= 24) p.ovr = Math.min(p.pot, p.ovr + (p.pot - p.ovr) * .3);
      if (p.age >= 31) p.ovr -= (p.age - 30) * .6;
      if (p.age >= 36) G.P[p.id] = null;
      continue;
    }
    const retire = (p.age >= 33 && rnd() < (p.age - 32) * .16) || p.age >= 39 || (p.ovr < 45 && p.age > 27 && rnd() < .5);
    if (retire) {
      if (p.c === m.cid) addNews(`${p.n}（${p.age - 1}歳）が現役を引退した`);
      if (p.c >= 0) setClub(p, -1);
      G.P[p.id] = null;
      continue;
    }
    if (p.c >= 0) {
      p.yrs--;
      if (p.yrs <= 0) {
        if (p.c === m.cid) {
          const sal = Math.round(salaryFor(p.ovr, isForeign(p)) * (.9 + rnd() * .3) / 10) * 10;
          m.renew.push({ id: p.id, sal });
        } else if (rnd() < .78) { p.yrs = ri(1, 3); p.sal = salaryFor(p.ovr, isForeign(p)); }
        else setClub(p, -1);
      }
    }
    p.cond = 100; p.inj = 0; p.sus = 0;
  }
  G.watch = G.watch.filter(id => G.P[id]);
  if (m.lineup) m.lineup = m.lineup.map(id => (id != null && G.P[id] && G.P[id].c === m.cid) ? id : null);
  aiOffseason();
  if (m.money < -30000) { G.over = true; summary.over = true; }
  startSeason(false);
  if (m.renew.length) addNews(`${m.renew.length}人の選手が契約満了を迎えた。プレシーズン中に更改しないと退団する`, 'warn');
  return summary;
}
function aiOffseason() {
  const free = () => G.P.filter(p => p && p.c === -1);
  // 上位カテゴリのクラブが下位から主力を引き抜く
  for (const c of shuffle(G.C.filter(c => !c.me && c.div !== 'J3'))) {
    if (rnd() > .5) continue;
    const need = clubStrength(c);
    const cands = G.P.filter(p => p && p.c >= 0 && p.c !== c.id && !G.C[p.c].me && DIVS.indexOf(G.C[p.c].div) > DIVS.indexOf(c.div) && p.ovr > need && p.age < 30);
    if (!cands.length) continue;
    const p = pick(cands), from = G.C[p.c];
    setClub(p, c.id); p.yrs = ri(2, 4); p.sal = salaryFor(p.ovr, isForeign(p));
    if (rnd() < .2) addNews(`${p.n}が${from.name}から${c.name}へ移籍`);
  }
  for (const c of G.C) {
    if (c.me) continue;
    // 若手を2人
    for (let i = 0; i < 2; i++) { const y = mkP(genYouth(0, 56, { J1: 86, J2: 80, J3: 76 }[c.div])); setClub(y, c.id); }
    // 24人になるまでフリーから補強
    let guard = 0;
    while (c.pids.length < 24 && guard++ < 20) {
      const s = clubStrength(c);
      const fa = free().filter(p => p.ovr <= s + 3).sort((a, b) => b.ovr - a.ovr);
      const p = fa.length ? fa[ri(0, Math.min(4, fa.length - 1))] : mkP({ n: jpName(), nat: '日本', age: ri(20, 29), pos: pick(POS), ovr: s - ri(3, 8), pot: s });
      setClub(p, c.id); p.yrs = ri(1, 3); p.sal = salaryFor(p.ovr, isForeign(p));
    }
    // 多すぎる場合は放出
    while (c.pids.length > 32) { const p = players(c).sort((a, b) => a.ovr - b.ovr)[0]; setClub(p, -1); }
    // GKは最低2人
    while (players(c).filter(p => p.pos === 'GK').length < 2) { const p = mkP({ n: jpName(), nat: '日本', age: ri(20, 30), pos: 'GK', ovr: clubStrength(c) - 6, pot: clubStrength(c) - 3 }); setClub(p, c.id); }
    c.form = rnd() < .2 ? pick(Object.keys(FORMS)) : c.form;
    c.coach = { J1: 3, J2: 2, J3: 1 }[c.div] + ri(0, 1);
  }
  // フリー市場に新しい顔ぶれを
  for (let i = 0; i < 40; i++) { const p = mkP({ n: jpName(), nat: '日本', age: ri(18, 31), pos: pick(POS), ovr: ri(45, 63), pot: 0, yrs: 1 }); p.pot = p.ovr + (p.age < 24 ? ri(2, 14) : 0); }
  // フリーで長く残る高齢選手は引退
  for (const p of free()) if (p.age >= 32 && rnd() < .5) G.P[p.id] = null;
}

/* ---------- 表示用 ---------- */
function fmtMoney(v) {
  const s = v < 0 ? '−' : '', a = Math.abs(v);
  if (a >= 10000) return s + (a / 10000).toFixed(a >= 100000 ? 1 : 2).replace(/\.?0+$/, '') + '億円';
  return s + Math.round(a).toLocaleString() + '万円';
}
function nextFixture() {
  if (G.phase !== 'season' || G.md >= SEASON_WEEKS) return null;
  const pair = G.fx[myDiv()][G.md].find(x => x.includes(G.me.cid));
  if (!pair) return null;
  const home = pair[0] === G.me.cid;
  return { home, opp: home ? pair[1] : pair[0], md: G.md + 1 };
}
const cupNext = () => G.cup && !G.cup.champ && G.cup.ties.some(t => t.includes(G.me.cid)) ? CUP_AFTER[G.cup.r] : null;

/* ---------- 保存 ---------- */
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); return true; } catch (e) { return false; }
}
function load() {
  try { const s = localStorage.getItem(SAVE_KEY); if (!s) return null; const g = JSON.parse(s); return g && g.v === 1 ? g : null; } catch (e) { return null; }
}
function wipe() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* 保存できない環境 */ } }

<script>

}
const knowsPot = p => p.c === G.me.cid || G.watch.includes(p.id);
function condBar(p) {

function prow(p, extra = '') {

const ICONS = {

  market: '<path d="M4 7h13l-3-3M20 17H7l3 3"/>',

};

function vHome() {
  const m = G.me;
  let hero;
  if (G.phase === 'pre') {
    const probs = canStart();

      <section class="card"><h2>プレシーズンの準備</h2><div class="check">${items.map(([k, t, v, on, need]) => `<button data-a="pre" data-v="${k}"><span class="dot ${on ? 'on' : need ? 'need' : ''}"></span><span>${t}<br><small class="muted">${v}</small></span><span class="chev">›</span></button>`).join('')}</div></section>`;

        <div class="fx-vs"><div class="fx-team"><b>${h(H.name)}</b><small>${rankOf(H.id)}位</small></div><div class="fx-mid">VS</div><div class="fx-team"><b>${h(A.name)}</b><small>${rankOf(A.id)}位</small></div></div>
        ${cn === nf.md ? `<small style="position:relative;opacity:.85">この節のあとに天皇杯${CUP_ROUNDS[G.cup.r]}があります</small>` : ''}

  return `${hero}
    <div class="stats">
      <div class="stat"><small>資金</small><b class="num" style="${m.money < 0 ? 'color:var(--bad)' : ''}">${fmtMoney(m.money)}</b></div>
      <div class="stat"><small>サポーター</small><b class="num">${m.fans.toLocaleString()}人</b></div>
      <div class="stat"><small>${myDiv()} 順位</small><b class="num">${G.phase === 'pre' ? '—' : rk + '位'}</b><small class="num">${t.w}勝${t.d}分${t.l}敗</small></div>
      <div class="stat"><small>スタジアム</small><b class="num">${cap.toLocaleString()}人</b><span class="pill ${windowOpen() ? 'good' : ''}">移籍市場 ${windowOpen() ? '開' : '閉'}</span></div>
    </div>
    ${G.offers.length ? `<section class="card"><h2>届いているオファー</h2>${G.offers.map((o, i) => offerRow(o, i)).join('')}</section>` : ''}
    <section class="card"><h2>ニュース</h2><ul class="news">${G.news.slice(0, 14).map(n => `<li class="${n.kind}"><span class="when num">${n.y}<br>${n.md ? n.md + '節' : 'オフ'}</span><span>${n.kind === 'big' ? `<b>${h(n.text)}</b>` : h(n.text)}</span></li>`).join('')}</ul></section>`;

    </section>
    <div class="pitch"><span class="circle"></span><span class="box t"></span><span class="box b"></span>${slots}</div>
    <small class="muted" style="text-align:center">選手をタップして入れ替え。数字は適性とコンディションを反映した実力。枠が黄色いのはポジション違いです。</small>
    <section class="card"><h2>控え</h2><div class="plist" style="border:0">${bench.map(p => prow(p, condBar(p))).join('') || '<div class="empty">控えがいません</div>'}</div></section>`;
}

/* ---------- 移籍 ---------- */
function marketList() {
  const f = UI.f;
  let L;
  if (f.src === 'watch') L = G.watch.map(id => G.P[id]).filter(p => p && p.c !== G.me.cid);
  else if (f.src === 'FA') L = G.P.filter(p => p && p.c === -1);
  else L = G.P.filter(p => p && p.c >= 0 && p.c !== G.me.cid && G.C[p.c].div === f.src);
  if (f.pos) L = L.filter(p => p.pos === f.pos || p.sub === f.pos);
  if (f.q) L = L.filter(p => p.n.includes(f.q) || (p.c >= 0 && G.C[p.c].name.includes(f.q)) || (p.ab || '').includes(f.q));
  const ord = { ovr: (a, b) => b.ovr - a.ovr, age: (a, b) => a.age - b.age, cheap: (a, b) => valueOf(a) - valueOf(b), pot: (a, b) => (knowsPot(b) ? b.pot : 0) - (knowsPot(a) ? a.pot : 0) };

}

  let body = '';
  if (UI.mkt === 'search') {
    const L = marketList();
    body = `<div class="opts">
      ${chips('src', UI.f.src, [['J1', 'J1'], ['J2', 'J2'], ['J3', 'J3'], ['FA', 'フリー'], ['watch', `リスト(${G.watch.length})`]])}
      ${chips('pos', UI.f.pos, [['', '全員'], ...POS.map(p => [p, p])])}
      ${chips('fsort', UI.f.sort, [['ovr', '評価順'], ['pot', '伸びしろ順'], ['age', '若い順'], ['cheap', '安い順']])}

      <small class="muted">${L.length}人が見つかりました。伸びしろはスカウトがリストに入れた選手だけ分かります。欧州の選手はスカウトを派遣すると「リスト」に入ります。</small>
      <div class="plist">${L.slice(0, UI.limit).map(p => prow(p)).join('') || '<div class="empty">該当する選手はいません</div>'}
      ${L.length > UI.limit ? `<button class="more" data-a="more">さらに表示（残り${L.length - UI.limit}人）</button>` : ''}</div>`;
  } else if (UI.mkt === 'scout') {

      <div>${scoutRegions().map(r => `<button class="region" data-a="scout" data-k="${h(r.k)}" ${s || r.lock ? 'disabled' : ''}><span><b>${h(r.n)}</b><br><small class="muted">${r.lock ? `スカウトLv${r.need}以上で派遣できます` : `${r.wk}週 · ${fmtMoney(r.cost)}`}</small></span><span class="chev muted">›</span></button>`).join('')}</div></section>`;
  } else {
    body = `<section class="card"><h2>届いているオファー</h2>${G.offers.length ? G.offers.map((o, i) => offerRow(o, i)).join('') : '<div class="empty">いまはオファーがありません。選手を移籍リストに載せると届きやすくなります。</div>'}</section>
      <section class="card"><h2>交渉の記録</h2>${G.log.length ? `<ul class="news">${G.log.slice(0, 15).map(l => `<li><span class="when num">${l.y}<br>${l.md ? l.md + '節' : 'オフ'}</span><span>${h(l.text)}</span></li>`).join('')}</ul>` : '<div class="empty">まだ交渉していません</div>'}</section>`;
  }
  return `${seg('mkt', UI.mkt, [['search', '選手をさがす'], ['scout', 'スカウト'], ['offers', `オファー${G.offers.length ? '(' + G.offers.length + ')' : ''}`]])}${banner}${body}`;

/* ---------- クラブ ---------- */
function vClub() {
  const m = G.me;
  let body = '';
  if (UI.club === 'fac') {
    body = `<section class="card"><h2>施設</h2>${Object.entries(FAC).map(([k, f]) => {
      const lv = m.fac[k], nx = lv + 1, b = m.build.find(x => x.k === k);
      const pips = Array.from({ length: f.max }, (_, i) => `<i class="${i < lv ? 'on' : ''}"></i>`).join('');
      const cur = k === 'stadium' ? `収容${f.cap[lv].toLocaleString()}人` : `Lv${lv}`;
      const act = b ? `<span class="pill amber">Lv${b.lv}へ工事中・あと${b.w}週</span>`
        : nx > f.max ? '<span class="pill good">最大レベル</span>'
          : `<button class="btn sm" data-a="build" data-k="${k}" ${m.money < f.cost[nx] ? 'disabled' : ''}>Lv${nx}へ ${fmtMoney(f.cost[nx])}・${f.wk[nx]}週</button>`;
      return `<div class="fac"><div class="fac-h"><b>${f.n}</b><span class="pips">${pips}</span></div><p>${f.desc}</p>
        <div class="fac-a"><small class="muted">いま：${cur}${k === 'stadium' && nx <= f.max ? ` → ${f.cap[nx].toLocaleString()}人` : ''}</small>${act}</div></div>`;
    }).join('')}</section>`;
  } else if (UI.club === 'staff') {
    body = `<section class="card"><h2>いまのスタッフ</h2><div class="rows">${Object.entries(STAFF).map(([k, s]) => `<div><span><b>${s.n}</b> ${h(m.staff[k].n)}<br><small class="muted">${s.desc}</small></span><span class="num">Lv${m.staff[k].lv}<br><small class="muted">${fmtMoney(m.staff[k].sal)}/年</small></span></div>`).join('')}</div></section>
      <section class="card"><h2>候補</h2>${G.phase !== 'pre' ? '<div class="empty">スタッフの入れ替えはプレシーズンにできます</div>' : m.staffCands.length ? `<div class="rows">${m.staffCands.map((s, i) => `<div><span><b>${STAFF[s.role].n}</b> ${h(s.n)}<br><small class="muted">Lv${s.lv} · 年俸${fmtMoney(s.sal)} · 契約金${fmtMoney(Math.round(s.sal * .5))}</small></span><button class="btn sm" data-a="hire" data-i="${i}" ${s.lv <= m.staff[s.role].lv ? 'disabled' : ''}>${s.lv <= m.staff[s.role].lv ? 'いまと同等以下' : '契約する'}</button></div>`).join('')}</div>` : '<div class="empty">候補はいません</div>'}</section>`;
  } else if (UI.club === 'money') {
    const f = G.fin, inn = Object.values(f.in).reduce((a, b) => a + b, 0), out = Object.values(f.out).reduce((a, b) => a + b, 0);
    const IN = { ticket: '入場料', merch: 'グッズ', sponsor: 'スポンサー', dist: 'リーグ分配金', prize: '賞金', sale: '選手売却' };
    const OUT = { salary: '選手年俸', staff: 'スタッフ年俸', maint: '施設維持費', build: '施設工事', buy: '移籍金', other: 'その他（キャンプ・スカウトなど）' };
    const att = f.att.length ? Math.round(f.att.reduce((a, b) => a + b, 0) / f.att.length) : 0;
    body = `<section class="card"><h2>${G.year}年の収支</h2><div class="rows">
        ${Object.entries(IN).map(([k, t]) => `<div><span>${t}</span><span class="num">${fmtMoney(f.in[k] || 0)}</span></div>`).join('')}
        <div class="total"><span>収入 計</span><span class="num">${fmtMoney(inn)}</span></div></div>
      <div class="rows">${Object.entries(OUT).map(([k, t]) => `<div><span>${t}</span><span class="num">−${fmtMoney(f.out[k] || 0)}</span></div>`).join('')}
        <div class="total"><span>支出 計</span><span class="num">−${fmtMoney(out)}</span></div>
        <div class="total"><span>収支</span><span class="num" style="color:var(--${inn - out >= 0 ? 'good' : 'bad'})">${fmtMoney(inn - out)}</span></div></div></section>
      <section class="card"><h2>チケット価格</h2>
        <div class="fac-a"><div class="stepper"><button data-a="price" data-v="-500" aria-label="下げる">−</button><b class="num">${m.price.toLocaleString()}円</b><button data-a="price" data-v="500" aria-label="上げる">＋</button></div>
        <small class="muted">平均観客 ${att.toLocaleString()}人 / 収容${FAC.stadium.cap[m.fac.stadium].toLocaleString()}人</small></div>
        <small class="muted">安いほど観客が増え、高いほど1人あたりの収入が増えます。</small></section>
      <section class="card"><h2>スポンサー</h2>${m.sponsor ? `<div class="rows"><div><span><b>${h(m.sponsor.n)}</b><br><small class="muted">${h(m.sponsor.note)}</small></span><span class="num">${fmtMoney(m.sponsor.amt)}/年</span></div></div>` : '<div class="empty">プレシーズンに選んでください</div>'}</section>
      <section class="card"><h2>練習方針</h2>${chips('policy', m.policy, [['normal', '通常'], ['youth', '若手育成'], ['rest', '回復重視']])}
        <small class="muted">若手育成：23歳以下が伸びやすいが疲れが抜けにくい。回復重視：コンディションが戻りやすいが成長は遅め。</small></section>`;
  } else {
    body = `<section class="card"><h2>タイトル</h2>${G.titles.length ? `<div class="rows">${G.titles.map(t => `<div><span>${h(t.t)}</span><span class="num">${t.y}年</span></div>`).join('')}</div>` : '<div class="empty">まだタイトルはありません</div>'}</section>
      <section class="card"><h2>歴代成績</h2>${G.hist.length ? `<div class="tbl-wrap" style="border:0"><table><thead><tr><th>年</th><th>リーグ</th><th>順位</th><th>勝-分-敗</th><th>天皇杯</th><th>サポーター</th></tr></thead><tbody>${G.hist.slice().reverse().map(r => `<tr><td>${r.y}</td><td>${r.div}</td><td>${r.rank}位</td><td>${r.w}-${r.d}-${r.l}</td><td>${h(r.cup)}</td><td>${r.fans.toLocaleString()}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">最初のシーズンが終わると記録されます</div>'}</section>
      <section class="card"><h2>設定</h2>
        <div class="toggle"><span>試合経過を表示する<br><small class="muted">オフにすると結果だけを表示します</small></span><button class="sw-t" role="switch" aria-checked="${m.watch !== false}" data-a="watchT" aria-label="試合経過を表示"></button></div>
        ${UI.confirm === 'reset' ? `<div class="confirm"><b>セーブデータを消して最初からやり直しますか？</b><span class="btns"><button class="btn sm bad" data-a="resetYes">消してやり直す</button><button class="btn sm ghost" data-a="confirmNo">やめる</button></span></div>` : '<button class="btn ghost" data-a="reset">最初からやり直す</button>'}
      </section>`;
  }
  return `${seg('club', UI.club, [['fac', '施設'], ['staff', 'スタッフ'], ['money', '経営'], ['rec', '記録・設定']])}${body}`;
}

/* ---------- 順位 ---------- */
function vLeague() {
  const d = UI.lgDiv || myDiv();
  let body = '';
  if (UI.lg === 'table') {
    const T = table(d);
    body = `<div class="tbl-wrap"><table><thead><tr><th></th><th>クラブ</th><th>試</th><th>勝</th><th>分</th><th>敗</th><th>得失</th><th>勝点</th><th>直近</th></tr></thead><tbody>${T.map((r, i) => {
      const zone = (d !== 'J1' && i < 3) ? 'up' : (d !== 'J3' && i >= T.length - 3) ? 'down' : '';
      return `<tr class="${r.id === G.me.cid ? 'mine' : ''}"><td class="num" style="text-align:left;position:relative;padding-left:10px"><span style="position:absolute;left:0;top:0;bottom:0;width:4px;background:${zone === 'up' ? 'var(--good)' : zone === 'down' ? 'var(--bad)' : 'transparent'}"></span>${i + 1}</td><td>${h(G.C[r.id].name)}</td><td>${r.w + r.d + r.l}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf - r.ga > 0 ? '+' : ''}${r.gf - r.ga}</td><td><b>${r.p}</b></td><td class="form">${r.f.split('').map(x => `<span class="${x}">${{ W: '○', D: '△', L: '●' }[x]}</span>`).join('')}</td></tr>`;
    }).join('')}</tbody></table></div>
    <small class="muted">${d === 'J1' ? '下位3クラブがJ2へ降格。' : d === 'J2' ? '上位3クラブがJ1へ昇格、下位3クラブがJ3へ降格。' : '上位3クラブがJ2へ昇格。'}</small>`;
  } else if (UI.lg === 'res') {
    const last = G.last[d] || [];
    const nxt = G.phase === 'season' && G.md < SEASON_WEEKS ? G.fx[d][G.md] : G.phase === 'pre' ? G.fx[d][0] : [];
    const row = (a, b, mid) => `<div class="fac-a" style="border-top:1px solid var(--line);padding:8px 0;flex-wrap:nowrap"><span style="flex:1;text-align:right;${a === G.me.cid ? 'font-weight:700' : ''}">${h(G.C[a].name)}</span><b class="num" style="min-width:56px;text-align:center">${mid}</b><span style="flex:1;${b === G.me.cid ? 'font-weight:700' : ''}">${h(G.C[b].name)}</span></div>`;
    body = `<section class="card"><h2>${G.md ? `第${G.md}節の結果` : '結果'}</h2>${last.length ? last.map(r => row(r.h, r.a, `${r.gh} - ${r.ga}`)).join('') : '<div class="empty">まだ試合がありません</div>'}</section>
      <section class="card"><h2>次の節の組み合わせ</h2>${nxt.length ? nxt.map(([a, b]) => row(a, b, 'vs')).join('') : '<div class="empty">今シーズンの日程は終わりました</div>'}</section>`;
  } else if (UI.lg === 'sc') {
    const L = G.P.filter(p => p && p.c >= 0 && G.C[p.c].div === d && p.st.g > 0).sort((a, b) => b.st.g - a.st.g || b.st.a - a.st.a).slice(0, 20);
    body = `<div class="tbl-wrap"><table><thead><tr><th></th><th>選手</th><th>得点</th><th>アシスト</th><th>出場</th></tr></thead><tbody>${L.map((p, i) => `<tr class="${p.c === G.me.cid ? 'mine' : ''}" data-a="player" data-id="${p.id}"><td>${i + 1}</td><td>${h(p.n)}<br><small class="muted">${h(G.C[p.c].name)}</small></td><td><b>${p.st.g}</b></td><td>${p.st.a}</td><td>${p.st.ap}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">まだ得点がありません</td></tr>'}</tbody></table></div>`;
  } else {
    const cup = G.cup, mine = G.me.cid;
    const status = cup.champ != null ? `優勝：${h(G.C[cup.champ].name)}` : cup.out[mine] ? `${h(me().name)}は${cup.out[mine]}で敗退` : `次は${CUP_ROUNDS[cup.r]}（第${CUP_AFTER[cup.r]}節のあと）`;
    const tie = cup.ties.find(t => t.includes(mine));
    const byRound = CUP_ROUNDS.map((n, r) => ({ n, list: cup.res.filter(x => x.r === r) })).filter(x => x.list.length);
    body = `<section class="card"><h2>天皇杯</h2><div class="banner">${status}${tie ? `<br>対戦相手：${h(G.C[tie[0] === mine ? tie[1] : tie[0]].name)}` : ''}${cup.r === 0 && cup.byes.includes(mine) ? '<br>シードのため2回戦から出場' : ''}</div>
      <small class="muted">全60クラブのトーナメント。優勝賞金1.5億円。第${CUP_AFTER.join('・')}節のあとに行われます。</small></section>
      ${byRound.reverse().map(r => `<section class="card"><h2>${r.n}</h2>${r.list.filter(x => r.list.length <= 8 || x.h === mine || x.a === mine || DIVS.indexOf(G.C[x.h].div) === 0).map(x => `<div class="fac-a" style="border-top:1px solid var(--line);padding:6px 0;flex-wrap:nowrap;font-size:14px"><span style="flex:1;text-align:right">${h(G.C[x.h].name)}</span><b class="num" style="min-width:70px;text-align:center">${x.gh}-${x.ga}${x.pk ? `<br><small>PK${x.pk[0]}-${x.pk[1]}</small>` : ''}</b><span style="flex:1">${h(G.C[x.a].name)}</span></div>`).join('')}</section>`).join('')}`;
  }
  return `${seg('lg', UI.lg, [['table', '順位表'], ['res', '結果・日程'], ['sc', '得点ランキング'], ['cup', '天皇杯']])}
    ${UI.lg !== 'cup' ? chips('lgDiv', d, DIVS.map(x => [x, x])) : ''}${body}`;
}

/* ---------- シート（下から出るパネル） ---------- */
function openSheet(s) { UI.sheet = s; renderSheet(); }
function closeSheet() { UI.sheet = null; UI.nego = null; UI.confirm = null; renderSheet(); }
function renderSheet() {
  const root = $('#sheetRoot');
  if (!UI.sheet) { root.innerHTML = ''; return; }
  const scroll = root.querySelector('.sheet') ? root.querySelector('.sheet').scrollTop : 0;
  const s = UI.sheet;
  const content = ({ player: shPlayer, slot: shSlot, sponsor: shSponsor, renew: shRenew, youth: shYouth, camp: shCamp, season: shSeason })[s.t](s);
  root.innerHTML = `<div class="scrim" data-a="scrim"><div class="sheet" role="dialog" aria-modal="true">${content}</div></div>`;
  root.querySelector('.sheet').scrollTop = scroll;
}
const sheetHead = (title, sub) => `<div class="sheet-h"><div><h3>${title}</h3>${sub ? `<small class="muted">${sub}</small>` : ''}</div><button class="x" data-a="close" aria-label="閉じる">×</button></div>`;

function shPlayer(s) {
  const p = G.P[s.id];
  if (!p) return sheetHead('選手') + '<div class="empty">この選手はもういません</div>';
  const mine = p.c === G.me.cid;
  const kp = knowsPot(p);
  const where = mine ? me().name : whereOf(p);
  let actions = '';
  if (mine) {
    actions = `<div class="btns"><button class="btn sm ghost" data-a="listT" data-id="${p.id}">${p.listed ? '移籍リストから外す' : '移籍リストに載せる'}</button>
      <button class="btn sm ghost" data-a="releaseAsk">契約を解除する</button></div>
      ${UI.confirm === 'release' ? `<div class="confirm"><b>${h(p.n)}との契約を解除しますか？</b><small>違約金として年俸の半分（${fmtMoney(Math.round(p.sal * .5))}）がかかります。</small><span class="btns"><button class="btn sm bad" data-a="release" data-id="${p.id}">解除する</button><button class="btn sm ghost" data-a="confirmNo">やめる</button></span></div>` : ''}`;
  } else {
    const n = UI.nego && UI.nego.pid === p.id ? UI.nego : null;
    if (n) {
      const od = negoOdds(p, n.fee, n.sal), tot = od.club * od.player;
      const lab = tot >= .7 ? ['good', '見込み：高い'] : tot >= .4 ? ['amber', '見込み：五分'] : tot >= .15 ? ['', '見込み：低い'] : ['bad', '見込み：かなり厳しい'];
      actions = `<section class="card"><h2>獲得交渉</h2>
        ${p.c !== -1 ? `<div class="fac-a"><span>移籍金<br><small class="muted">目安 ${fmtMoney(valueOf(p))}</small></span><div class="stepper"><button data-a="ng" data-k="fee" data-v="-1" aria-label="下げる">−</button><b class="num">${fmtMoney(n.fee)}</b><button data-a="ng" data-k="fee" data-v="1" aria-label="上げる">＋</button></div></div>` : '<small class="muted">フリーの選手なので移籍金はかかりません。</small>'}
        <div class="fac-a"><span>年俸<br><small class="muted">希望 ${fmtMoney(od.expect)}</small></span><div class="stepper"><button data-a="ng" data-k="sal" data-v="-1" aria-label="下げる">−</button><b class="num">${fmtMoney(n.sal)}</b><button data-a="ng" data-k="sal" data-v="1" aria-label="上げる">＋</button></div></div>
        <div class="fac-a"><span>契約年数</span>${chips('ngy', String(n.yrs), [['1', '1年'], ['2', '2年'], ['3', '3年'], ['4', '4年']])}</div>
        <div class="odds"><span class="pill ${lab[0]}">${lab[1]}</span><small class="muted">クラブ ${Math.round(od.club * 100)}% × 本人 ${Math.round(od.player * 100)}%</small></div>
        ${n.msg ? `<div class="msg ${n.ok ? 'ok' : 'ng'}">${h(n.msg)}</div>` : ''}
        <button class="btn amber wide" data-a="offer" ${n.ok ? 'disabled' : ''}>この条件で申し込む</button></section>`;
    } else {
      const canTalk = p.c === -1 || windowOpen();
      actions = `<div class="btns"><button class="btn" data-a="negoOpen" data-id="${p.id}">獲得交渉する</button>
        ${p.c >= 0 || p.c === -1 ? `<button class="btn ghost" data-a="watchP" data-id="${p.id}">${G.watch.includes(p.id) ? 'リストから外す' : 'リストに入れる'}</button>` : ''}</div>
        ${canTalk ? '' : '<small class="muted">移籍市場が閉まっているので、いまは交渉できません。</small>'}`;
    }
  }
  return `${sheetHead(h(p.n), `${POS_NAME[p.pos]}${p.sub ? '・' + POS_NAME[p.sub] : ''}`)}
    <div class="phead"><div class="big-ovr num">${ovrI(p)}<small>評価</small></div>
      <div><b>${h(where)}</b><br><small class="muted">${p.age}歳 · ${h(p.nat || '日本')}${p.lgn ? ' · ' + h(p.lgn) : ''}</small>
      ${p.legend ? `<br><span class="pill amber">レジェンド（${h(p.legend)}）</span>` : ''}</div></div>
    <div class="kv">
      <div><small>伸びしろ</small><b>${kp ? `${potGrade(p.pot)}（上限 ${Math.floor(p.pot)}）` : '？（スカウトで判明）'}</b></div>
      <div><small>市場価値</small><b class="num">${fmtMoney(valueOf(p))}</b></div>
      ${mine || p.c >= 0 ? `<div><small>年俸</small><b class="num">${fmtMoney(p.sal)}</b></div><div><small>契約</small><b>残り${p.yrs}年</b></div>` : ''}
      ${mine ? `<div><small>コンディション</small><b class="num">${Math.round(p.cond)}%</b></div><div><small>状態</small><b>${p.inj ? `負傷・あと${p.inj}週` : p.sus ? '出場停止' : '出場できる'}</b></div>` : ''}
      ${p.c >= 0 ? `<div><small>今季</small><b class="num">${p.st.ap}試合 ${p.st.g}得点 ${p.st.a}アシスト</b></div>` : ''}
      ${p.tot && p.tot.ap ? `<div><small>通算（このゲーム内）</small><b class="num">${p.tot.ap}試合 ${p.tot.g}得点</b></div>` : ''}
    </div>${actions}`;
}
function shSlot(s) {
  const m = G.me, slot = FORMS[m.form].s[s.i];
  const cur = m.lineup[s.i];
  const L = players(me()).sort((a, b) => effOf(b, slot) - effOf(a, slot));
  return `${sheetHead(`${slot}（${POS_NAME[slot]}）に入れる選手`, '数字は適性とコンディションを反映した、この位置での実力')}
    <div class="plist">${L.map(p => {
      const inXI = m.lineup.indexOf(p.id);
      const note = p.id === cur ? '<span class="pill good">いまの選手</span>' : inXI >= 0 ? `<span class="pill">${FORMS[m.form].s[inXI]}で先発</span>` : '';
      return `<button class="prow" data-a="pickSlot" data-i="${s.i}" data-id="${p.id}" ${available(p) ? '' : 'disabled style="opacity:.45"'}>
        <span class="pos pos-${POS_GROUP[p.pos]}">${p.pos}</span><span class="pn"><b>${h(p.n)}</b><small>${p.inj ? '負傷中' : p.sus ? '出場停止' : `評価${ovrI(p)} · 調子${Math.round(p.cond)}%`}</small></span>
        <span class="side">${note}</span><span class="ovr num">${Math.floor(effOf(p, slot))}</span></button>`;
    }).join('')}</div>`;
}
function shSponsor() {
  const m = G.me;
  return `${sheetHead('メインスポンサー', '1シーズン契約。開幕までに1社を選んでください')}
    <div class="plist">${m.sponsorCands.map((s, i) => `<button class="prow" style="grid-template-columns:1fr auto" data-a="sponsor" data-i="${i}">
      <span class="pn"><b>${h(s.n)}</b><small>${h(s.note)}${s.win ? ` · 1勝ごと+${fmtMoney(s.win)}` : ''}${s.rank ? ` · 3位以内で+${fmtMoney(s.rank)}` : ''}</small></span>
      <span class="side"><b class="num" style="color:var(--ink);font-size:15px">${fmtMoney(s.amt)}/年</b>${m.sponsor && m.sponsor.n === s.n ? '<span class="pill good">契約中</span>' : ''}</span></button>`).join('')}</div>`;
}
function shRenew() {
  const m = G.me;
  return `${sheetHead('契約更改', '更改しなかった選手は開幕時に退団します')}
    ${m.renew.length ? `<div class="plist">${m.renew.map(r => { const p = G.P[r.id]; if (!p) return ''; return `<div class="prow" style="grid-template-columns:36px 1fr"><span class="pos pos-${POS_GROUP[p.pos]}">${p.pos}</span>
      <span class="pn"><b>${h(p.n)}（${ovrI(p)}・${p.age}歳）</b><small>希望年俸 ${fmtMoney(r.sal)}（いま${fmtMoney(p.sal)}）</small>
      <span class="btns" style="margin-top:6px"><button class="btn sm" data-a="renew" data-id="${p.id}" data-y="1">1年</button><button class="btn sm" data-a="renew" data-id="${p.id}" data-y="2">2年</button><button class="btn sm" data-a="renew" data-id="${p.id}" data-y="3">3年</button><button class="btn sm ghost" data-a="letgo" data-id="${p.id}">放出</button></span></span></div>`; }).join('')}</div>` : '<div class="empty">契約満了の選手はいません</div>'}`;
}
function shYouth() {
  const m = G.me;
  return `${sheetHead('ユースからの昇格', `ユースアカデミーLv${m.fac.youth}。年俸240万円・3年契約。開幕までに決めないと他へ進みます`)}
    ${m.youth.length ? `<div class="plist">${m.youth.map((y, i) => `<div class="prow"><span class="pos pos-${POS_GROUP[y.pos]}">${y.pos}</span>
      <span class="pn"><b>${h(y.n)}</b><small>${y.age}歳 · 伸びしろ ${potGrade(y.pot)}</small></span>
      <span class="side"><button class="btn sm" data-a="youth" data-i="${i}">昇格させる</button></span><span class="ovr num">${y.ovr}</span></div>`).join('')}</div>` : '<div class="empty">候補はもういません</div>'}`;
}
function shCamp() {
  const m = G.me;
  const opts = [['none', '行かない', '費用なし'], ['home', '国内キャンプ', `${fmtMoney(1500)} · 若手が少し伸び、全員のコンディションが整う`], ['abroad', '海外キャンプ', `${fmtMoney(6000)} · 若手が大きく伸び、ベテランも少し伸びる`]];
  return `${sheetHead('キャンプ地', '開幕のときに費用を払い、効果が出ます')}
    <div class="plist">${opts.map(([k, t, d]) => `<button class="prow" style="grid-template-columns:1fr auto" data-a="camp" data-v="${k}"><span class="pn"><b>${t}</b><small>${d}</small></span><span class="side">${m.camp === k ? '<span class="pill good">選択中</span>' : ''}</span></button>`).join('')}</div>`;
}
function shSeason(s) {
  const r = s.sum, f = r.fin;
  const inn = Object.values(f.in).reduce((a, b) => a + b, 0), out = Object.values(f.out).reduce((a, b) => a + b, 0);
  if (r.over) return `${sheetHead(`${r.year}年シーズン終了`)}<div class="confirm"><b>資金が−3億円を下回ったため、クラブの経営から退くことになりました。</b><small>最終成績：${r.div} ${r.rank}位</small><button class="btn bad" data-a="resetYes">新しいクラブをつくる</button></div>`;
  return `${sheetHead(`${r.year}年シーズン終了`, `${r.div} ${r.rank}位`)}
    <div class="fixture"><div class="fx-vs" style="grid-template-columns:1fr"><div class="fx-team"><b>${r.div} ${r.rank}位</b><small>来季は${r.newDiv}で戦います</small></div></div></div>
    <section class="card"><div class="rows">${r.lines.map(l => `<div><span>${h(l)}</span></div>`).join('')}
      <div><span>シーズン収入</span><span class="num">${fmtMoney(inn)}</span></div><div><span>シーズン支出</span><span class="num">−${fmtMoney(out)}</span></div>
      <div class="total"><span>収支</span><span class="num" style="color:var(--${inn - out >= 0 ? 'good' : 'bad'})">${fmtMoney(inn - out)}</span></div></div></section>
    <small class="muted">選手が1歳年をとり、引退や契約満了が発生しました。プレシーズンの準備を始めましょう。</small>
    <button class="btn amber wide" data-a="close">プレシーズンへ</button>`;
}

/* ---------- 試合画面 ---------- */
function showNextMatch() {
  const r = UI.queue.shift();
  if (!r) { afterMatches(); return; }
  const el = $('#match'); el.hidden = false;
  const H = G.C[r.h], A = G.C[r.a];
  const col = c => c.me ? (c.color || COLORS[0]) : 'rgba(247,231,198,.35)';
  el.innerHTML = `<div class="mb"><div class="mb-label">${h(r.label)}${r.cup ? '' : r.h === G.me.cid ? ' · HOME' : ' · AWAY'}</div>
    <div class="mb-score"><div class="mb-team"><i style="background:${col(H)}"></i><b>${h(H.name)}</b></div>
      <div class="mb-digits num"><span id="sH">0</span><span class="sep">-</span><span id="sA">0</span></div>
      <div class="mb-team"><i style="background:${col(A)}"></i><b>${h(A.name)}</b></div></div>
    <div class="mb-clock num" id="clk">0'</div></div>
    <div class="feed" id="feed" aria-live="polite"><div class="ev half"><span class="t">キックオフ</span></div></div>
    <div class="mctl" id="mctl"><button class="btn ghost" data-a="mFast">早送り</button><button class="btn amber" data-a="mSkip">結果へ</button></div>`;
  const run = { r, i: 0, m: 0, gh: 0, ga: 0, end: r.et ? 120 : 90, speed: 110 };
  UI.run = run;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (G.me.watch === false || reduce) { finishMatch(); return; }
  tick();
}
function tick() {
  const run = UI.run; if (!run || run.done) return;
  run.m++;
  const feed = $('#feed');
  while (run.i < run.r.ev.length && run.r.ev[run.i].m <= run.m) addEv(run.r.ev[run.i++], feed);
  $('#clk').textContent = `${Math.min(run.m, run.end)}'`;
  if (run.m >= run.end) { finishMatch(); return; }
  run.t = setTimeout(tick, run.speed);
}
function addEv(e, feed) {
  const run = UI.run;
  if (e.t === 'goal') { if (e.side === 0) run.gh++; else run.ga++; $('#sH').textContent = run.gh; $('#sA').textContent = run.ga; }
  const cls = e.t === 'half' || e.t === 'pk' ? 'half' : e.t;
  feed.insertAdjacentHTML('beforeend', `<div class="ev new ${cls} ${e.side === 1 ? 'a' : ''}"><span class="m num">${e.m}'</span><span class="t">${h(e.text)}</span></div>`);
  feed.scrollTop = feed.scrollHeight;
}
function finishMatch() {
  const run = UI.run; if (!run || run.done) return;
  run.done = true; clearTimeout(run.t);
  const feed = $('#feed'), r = run.r;
  while (run.i < r.ev.length) addEv(r.ev[run.i++], feed);
  $('#sH').textContent = r.gh; $('#sA').textContent = r.ga; $('#clk').textContent = '試合終了';
  const mine = r.h === G.me.cid ? 0 : 1;
  const res = r.win === mine ? '勝利' : r.win === -1 ? '引き分け' : '敗戦';
  const div = G.C[G.me.cid].div;
  const others = !r.cup ? (G.last[div] || []).filter(x => x.h !== r.h) : [];
  feed.insertAdjacentHTML('beforeend', `<div class="sum"><h4>${res}${r.pk ? `（PK ${r.pk[0]}-${r.pk[1]}）` : r.et ? '（延長）' : ''}</h4>
    ${r.att ? `<div class="row"><span>観客数</span><b class="num">${r.att.toLocaleString()}人</b></div>` : ''}
    <div class="row"><span>サポーター</span><b class="num">${r.fansDelta >= 0 ? '+' : ''}${r.fansDelta.toLocaleString()}人</b></div>
    ${!r.cup ? `<div class="row"><span>${div} 順位</span><b class="num">${rankOf(G.me.cid)}位</b></div>` : ''}</div>
    ${others.length ? `<div class="sum"><h4>ほかの試合</h4>${others.map(x => `<div class="res"><span>${h(G.C[x.h].name)}</span><b class="num">${x.gh}-${x.ga}</b><span>${h(G.C[x.a].name)}</span></div>`).join('')}</div>` : ''}`);
  feed.scrollTop = 0;
  $('#mctl').innerHTML = `<button class="btn amber" data-a="mClose">${UI.queue.length ? '次の試合へ' : 'つづける'}</button>`;
}
function afterMatches() {
  $('#match').hidden = true; $('#match').innerHTML = ''; UI.run = null;
  if (G.phase === 'season' && G.md >= SEASON_WEEKS) {
    const sum = endSeason();
    save();
    UI.tab = 'home';
    render();
    openSheet({ t: 'season', sum });
    return;
  }
  render();
}

/* ---------- 操作 ---------- */
const ACT = {
  color: d => { UI.setup.color = d.v; renderStart(); },
  diff: d => { UI.setup.diff = d.v; renderStart(); },
  found: () => {
    const name = ($('#cname').value || '').trim() || 'FCホームタウン';
    const short = ($('#cshort').value || '').trim() || name.slice(0, 3);
    buildWorld({ name, short, pref: $('#pref').value, color: UI.setup.color, diff: UI.setup.diff });
    if (!save()) toast('この環境ではセーブできません。ページを閉じると進行が消えます');
    boot();
  },
  continue: () => { G = load(); boot(); },
  tab: d => { UI.tab = d.v; UI.confirm = null; render(); window.scrollTo(0, 0); },
  set: d => {
    const m = G.me;
    if (d.k === 'form') { m.form = d.v; m.lineup = null; }
    else if (d.k === 'style') m.style = d.v;
    else if (d.k === 'policy') m.policy = d.v;
    else if (d.k === 'src') { UI.f.src = d.v; UI.limit = 40; }
    else if (d.k === 'pos') { UI.f.pos = d.v; UI.limit = 40; }
    else if (d.k === 'fsort') UI.f.sort = d.v;
    else if (d.k === 'ngy') { UI.nego.yrs = +d.v; UI.nego.msg = null; renderSheet(); return; }
    else UI[d.k] = d.v;
    save(); render();
  },
  press: () => { G.me.press = !G.me.press; save(); render(); },
  auto: () => { G.me.auto = !G.me.auto; save(); render(); },
  watchT: () => { G.me.watch = G.me.watch === false; save(); render(); },
  more: () => { UI.limit += 60; render(); },
  pre: d => {
    if (d.v === 'market') { UI.tab = 'market'; render(); return; }
    if (d.v === 'staff') { UI.tab = 'club'; UI.club = 'staff'; render(); return; }
    openSheet({ t: d.v });
  },
  kickoff: () => { if (canStart().length) return; kickoff(); save(); render(); toast(`${G.year}年シーズン開幕！`); },
  next: () => {
    const shows = playRound();
    save();
    UI.queue = shows;
    showNextMatch();
  },
  mFast: () => { if (UI.run) UI.run.speed = 20; },
  mSkip: () => finishMatch(),
  mClose: () => showNextMatch(),
  player: d => { UI.nego = null; UI.confirm = null; openSheet({ t: 'player', id: +d.id }); },
  slot: d => openSheet({ t: 'slot', i: +d.i }),
  pickSlot: d => {
    const m = G.me, i = +d.i, id = +d.id;
    const j = m.lineup.indexOf(id);
    if (j >= 0) m.lineup[j] = m.lineup[i];
    m.lineup[i] = id; m.auto = false;
    save(); closeSheet(); render();
  },
  close: () => { closeSheet(); render(); },
  scrim: (d, t, e) => { if (e.target.classList.contains('scrim')) { closeSheet(); render(); } },
  sponsor: d => { G.me.sponsor = G.me.sponsorCands[+d.i]; save(); closeSheet(); render(); toast(`${G.me.sponsor.n}とスポンサー契約を結んだ`); },
  camp: d => { G.me.camp = d.v; save(); closeSheet(); render(); },
  renew: d => { renewContract(+d.id, +d.y); save(); render(); },
  letgo: d => {
    const p = G.P[+d.id];
    G.me.renew = G.me.renew.filter(x => x.id !== +d.id);
    if (p) { setClub(p, -1); addNews(`${p.n}が契約満了で退団した`); }
    save(); render();
  },
  youth: d => { const e = signYouth(+d.i); if (e) toast(e); save(); render(); },
  hire: d => { const e = hireStaff(+d.i); toast(e || 'スタッフと契約しました'); save(); render(); },
  build: d => { const e = buildFacility(d.k); toast(e || '工事を始めました'); save(); render(); },
  price: d => { G.me.price = clamp(G.me.price + +d.v, 1000, 6000); save(); render(); },
  scout: d => { sendScout(d.k); save(); render(); toast(G.scout ? 'スカウトを派遣しました' : 'スカウトが戻りました。リストを確認しましょう'); },
  offerOk: d => { const e = acceptOffer(+d.i); toast(e || '売却しました'); save(); render(); },
  offerNg: d => { G.offers.splice(+d.i, 1); save(); render(); },
  listT: d => { const p = G.P[+d.id]; p.listed = !p.listed; save(); render(); },
  releaseAsk: () => { UI.confirm = 'release'; renderSheet(); },
  confirmNo: () => { UI.confirm = null; render(); },
  release: d => { const e = release(+d.id); toast(e || '契約を解除しました'); save(); closeSheet(); render(); },
  watchP: d => { const id = +d.id; G.watch = G.watch.includes(id) ? G.watch.filter(x => x !== id) : [id].concat(G.watch); save(); render(); },
  negoOpen: d => {
    const p = G.P[+d.id];
    const fee = p.c === -1 ? 0 : valueOf(p);
    UI.nego = { pid: p.id, fee, sal: salaryFor(p.ovr, isForeign(p)), yrs: 3, msg: null };
    renderSheet();
  },
  ng: d => {
    const n = UI.nego, p = G.P[n.pid];
    if (d.k === 'fee') n.fee = Math.max(0, Math.round((n.fee + valueOf(p) * .1 * +d.v) / 10) * 10);
    else n.sal = Math.max(240, Math.round((n.sal + salaryFor(p.ovr, isForeign(p)) * .1 * +d.v) / 10) * 10);
    n.msg = null; renderSheet();
  },
  offer: () => {
    const n = UI.nego;
    const r = negotiate(n.pid, n.fee, n.sal, n.yrs);
    n.msg = r.msg; n.ok = r.ok;
    if (r.ok) toast(r.msg);
    save(); render();
  },
  reset: () => { UI.confirm = 'reset'; render(); },
  resetYes: () => { wipe(); G = null; UI.sheet = null; UI.confirm = null; $('#sheetRoot').innerHTML = ''; $('#app').hidden = true; $('#start').hidden = false; renderStart(); window.scrollTo(0, 0); },
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]');
  if (!t || t.disabled) return;
  const f = ACT[t.dataset.a];
  if (f) f(t.dataset, t, e);
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') {
    UI.f.q = e.target.value.trim(); UI.limit = 40;
    clearTimeout(UI.qt);
    UI.qt = setTimeout(() => { render(); const q = $('#q'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }, 250);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && UI.sheet) { closeSheet(); render(); } });

function boot() {
  $('#start').hidden = true; $('#app').hidden = false;
  UI.f.src = myDiv() === 'J1' ? 'J2' : myDiv() === 'J2' ? 'J3' : 'J3';
  render();
  window.scrollTo(0, 0);
}
(function init() {
  $('#start').hidden = false;
  renderStart();
})();

</script>

</body>
</html>
